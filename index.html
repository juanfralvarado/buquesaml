<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--soft:#F3F3F3;--line:#E2E2E2;--mid:#BDBDBD;--ink:#000000;--ink2:#4A4A4A;--ink3:#7A7A7A;
  --acc:#2C24A9;--acc-soft:#ECEBFA;--nav:#000000;--nav-ink:#FFFFFF;
  --ok:#1E6B45;--ok-bg:#E6F3EC;--warn:#8A5A00;--warn-bg:#FBF1DC;--bad:#A3221F;--bad-bg:#FBE7E6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212;--soft:#1C1C1F;--line:#2C2C31;--mid:#55555C;--ink:#F4F4F4;--ink2:#C8C8CC;--ink3:#8E8E94;
  --acc:#8B84F0;--acc-soft:#23213F;--nav:#000000;--nav-ink:#FFFFFF;
  --ok:#7FD1A4;--ok-bg:#15291F;--warn:#F1C46B;--warn-bg:#2E2412;--bad:#F29A96;--bad-bg:#331716;}}
:root[data-theme="dark"]{
  --bg:#121212;--soft:#1C1C1F;--line:#2C2C31;--mid:#55555C;--ink:#F4F4F4;--ink2:#C8C8CC;--ink3:#8E8E94;
  --acc:#8B84F0;--acc-soft:#23213F;--ok:#7FD1A4;--ok-bg:#15291F;--warn:#F1C46B;--warn-bg:#2E2412;--bad:#F29A96;--bad-bg:#331716;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Helvetica,sans-serif;font-size:14px;line-height:1.5}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
nav.side{background:var(--nav);color:var(--nav-ink);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 22px}
.brand b{font-size:22px;letter-spacing:-.02em}
.brand span{color:#8B84F0;font-weight:500}
.brand small{display:block;color:#9A9A9A;font-size:12px;margin-top:2px}
.navbtn{background:none;border:0;color:#CFCFCF;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.navbtn:hover{background:#1A1A1A;color:#fff}
.navbtn.on{background:#fff;color:#000;font-weight:600}
.navbtn .count{background:#2C24A9;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600}
.side .foot{margin-top:auto;font-size:11px;color:#8A8A8A;padding:0 8px}
main{padding:28px 36px 60px;max-width:1180px;width:100%}
.demo-banner{background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:8px 12px;font-size:12.5px;margin-bottom:22px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700}
h2{font-size:17px;margin:28px 0 12px;font-weight:600}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
.sub{color:var(--ink3);margin:0 0 20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--mid)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.kpi{background:var(--bg);padding:16px}
.kpi b{display:block;font-size:28px;letter-spacing:-.02em}
.kpi span{color:var(--ink3);font-size:12.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--ink3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)}
.c-n{background:var(--soft);color:var(--ink2)}
.c-acc{background:var(--acc-soft);color:var(--acc)}
.muted{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{border:1px solid var(--line);border-radius:8px;padding:18px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:16px 18px 18px;margin:0 0 16px}
legend{font-weight:600;padding:0 6px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--ink2);font-weight:500}
.f input,.f select{border:1px solid var(--mid);border-radius:6px;padding:8px 10px;background:var(--bg)}
.f .hint{font-size:11.5px;color:var(--ink3);min-height:16px}
.f .hint.ok{color:var(--ok)}.f .hint.bad{color:var(--bad)}
.span2{grid-column:span 2}.span3{grid-column:span 3}
/* Hull card — the memorable element */
.hull{background:var(--ink);color:var(--bg);border-radius:10px;padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.hull .imo{font-size:44px;font-weight:700;letter-spacing:.06em;line-height:1}
.hull .imo .cd{border-bottom:3px solid #8B84F0;padding-bottom:2px}
.hull .imo small{font-size:15px;letter-spacing:.2em;font-weight:500;margin-right:8px;opacity:.7}
.hull .nm{font-size:18px;font-weight:600;margin-top:10px}
.hull .meta{font-size:12.5px;opacity:.75;margin-top:4px}
.hull .cdnote{font-size:11px;opacity:.6;margin-top:10px}
.decision{text-align:right}
.decision .dlabel{font-size:12px;opacity:.7}
.decision .dval{font-size:22px;font-weight:700;margin-top:2px}
.decision .dscore{font-size:12.5px;opacity:.8}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.rules td:last-child,.rules th:last-child{text-align:right}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
/* pipeline */
.pipe{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:9px}
.pipe li{position:relative;padding:0 0 18px 24px}
.pipe li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--mid)}
.pipe li.run::before{border-color:var(--acc);background:var(--acc-soft)}
.pipe li.done::before{border-color:var(--acc);background:var(--acc)}

.pipe li .res{font-size:12.5px;color:var(--ink2);margin-top:4px}

.timeline{list-style:none;padding:0;margin:0}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.links a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;text-decoration:none}

  .navbtn{white-space:nowrap;gap:6px}

@media print{nav.side,.tabs,.btn,.demo-banner,.back{display:none!important}.app{display:block}}

function shipCheck(six){let s=0;for(let i=0;i<6;i++)s+=+six[i]*(7-i);return s%10}
function makeShip(six){return six+shipCheck(six)}
function validShip(n){n=String(n).replace(/\D/g,'');return n.length===7&&shipCheck(n.slice(0,6))===+n[6]}
const CW=[8,6,4,2,9,7];
function compCheck(six){let s=0;for(let i=0;i<6;i++)s+=+six[i]*CW[i];return (11-s%11)%10}
function makeComp(six){return six+compCheck(six)}
function validComp(n){n=String(n).replace(/\D/g,'');return n.length===7&&compCheck(n.slice(0,6))===+n[6]}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Motor de riesgo ---------- */
function assess(v){
  const r=[];const changesFlag=Math.max(0,v.history.filter(h=>daysAgo(h.date)<=365).length-1)+(v.declFlag||0);
  const changesName=v.declName||0;
  const hard=[];
  v.hits.forEach(h=>{if(h.type==='OMI exacto')hard.push('Coincidencia de OMI exacto en '+srcName(h.src))});
  if(v.iuu)hard.push('Buque en lista de pesca ilegal (IUU)');
  if(v.amp)hard.push('AMP: '+v.amp.status);
  if(v.banned)hard.push('Veto portuario vigente');
  const fuzzy=v.hits.filter(h=>h.type!=='OMI exacto');
  r.push({rule:'Coincidencia difusa de empresa en listas (≥85%)',pts:fuzzy.length?40:0});
  r.push({rule:'Cambios de bandera en últimos 12 meses (≥2)',pts:changesFlag>=2?20:0,detail:changesFlag+' cambio(s)'});
  r.push({rule:'Cambios de nombre en últimos 12 meses',pts:(changesName>0||v.history.filter(h=>daysAgo(h.date)<=365).length>1)?10:0});
  const age=new Date().getFullYear()-(+v.year||new Date().getFullYear());
  r.push({rule:'Antigüedad mayor a 20 años',pts:age>20?10:0,detail:age+' años'});
  r.push({rule:'Club P&I fuera del International Group o sin información',pts:v.pniIG?0:15});
  r.push({rule:'Sociedad clasificadora no IACS',pts:v.cls==='Sociedad IACS'?0:5});
  const dets=v.psc.filter(p=>p.det&&daysAgo(p.date)<=365).length;
  r.push({rule:'Detenciones portuarias en últimos 12 meses',pts:Math.min(dets*10,20),detail:dets+' detención(es)'});
  r.push({rule:'Beneficiario final no identificado',pts:v.parties.some(p=>p.role==='Beneficiario final'&&/no identificado/i.test(p.name))?15:0});
  r.push({rule:'OMI no encontrado en GISIS',pts:v.gisis?0:30});
  const score=Math.min(100,r.reduce((a,b)=>a+b.pts,0));
  let decision,cls;
  if(hard.length){decision='Bloquear';cls='c-bad'}
  else if(score>=30){decision=score>=60?'Revisar — riesgo alto':'Revisar';cls='c-warn'}
  else{decision='Aprobar';cls='c-ok'}
  return {rules:r,score,decision,cls,hard};
}

  return `<div class="grid2"><div class="panel"><h3>Listas operativas y Panamá</h3><table><tbody>
   <tr><td>Paris / Tokyo MoU — veto de acceso</td><td>${v.banned?'<span class="chip c-bad">Vetado</span>':'<span class="chip c-ok">No figura</span>'}</td></tr>
   <tr><td>Combined IUU Vessel List</td><td>${v.iuu?'<span class="chip c-bad">En lista</span>':'<span class="chip c-ok">No figura</span>'}</td></tr>
   <tr><td>AMP — cancelación (Decreto 512)</td><td>${v.amp?`<span class="chip c-bad">${esc(v.amp.status)}</span><br><span class="muted">${v.amp.date}</span>`:'<span class="chip c-ok">Sin registro</span>'}</td></tr>
   <tr><td>Rastreo AIS (apagones, transbordos)</td><td><span class="chip c-n">Fase 3</span></td></tr></tbody></table></div>
   <div class="panel"><h3>Historial de nombre y bandera</h3><ul class="timeline">${v.history.slice().reverse().map(h=>`<li><span class="mono muted">${h.date}</span><span><b>${esc(h.name)}</b> · ${esc(h.flag)}</span></li>`).join('')}</ul></div></div>
  <h2>Inspecciones del Estado rector del puerto</h2>
  ${v.psc.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Puerto</th><th>Régimen</th><th>Deficiencias</th><th>Detención</th></tr></thead><tbody>${v.psc.map(p=>`<tr><td class="mono">${p.date}</td><td>${esc(p.port)}</td><td>${esc(p.regime)}</td><td class="mono">${p.def}</td><td>${p.det?'<span class="chip c-warn">Sí</span>':'<span class="chip c-ok">No</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel muted">Sin inspecciones registradas. Verifica en Equasis desde la pestaña de verificación manual.</div>'}`;
}
function tVerificar(v){
  const L=[['Equasis — ficha del buque','Historial de nombres, banderas, gestores, inspecciones y P&I','https://www.equasis.org/'],
   ['GISIS (OMI) — Ship and Company Particulars','Confirma que el OMI existe, propietario registrado y compañía ISM','https://gisis.imo.org/Public/SHIPS/Default.aspx'],
   ['OFAC — Sanctions List Search','Filtra por tipo Vessel y busca el OMI '+v.imo,'https://sanctionssearch.ofac.treas.gov/'],
   ['UK Sanctions List — búsqueda','Búsqueda oficial del Reino Unido','https://search-uk-sanctions-list.service.gov.uk/'],
   ['Paris MoU — Banning list','Buques con veto de acceso a puertos europeos','https://parismou.org/banning/'],
   ['CIALA — Viña del Mar','Detenciones en puertos latinoamericanos','https://alvm.prefecturanaval.gob.ar/'],
   ['AMP — notas de prensa','Cancelaciones de registro de la bandera panameña','https://www.amp.gob.pa/']];
  return `<p class="sub">Equasis y GISIS no tienen API. El analista los abre desde aquí y deja constancia en el expediente.</p><div class="links grid2">${L.map(([t,d,u])=>`<a href="${u}" target="_blank" rel="noopener"><b>${t}</b><span>${d}</span></a>`).join('')}</div>`;
}
function tMonitoreo(v){
  return `<div class="grid2"><div class="panel"><h3>Monitoreo continuo</h3><p>Este buque y sus ${v.parties.length} partes se vuelven a revisar automáticamente cada vez que cambia una de las ${SOURCES.length} fuentes.</p><p class="muted">Próxima verificación programada: con la siguiente sincronización de OFAC (cada 30 min).</p><button class="btn ghost" id="rescreen">Re-screening ahora</button></div>
  <div class="panel"><h3>Bitácora</h3><ul class="timeline">${v.events.slice().reverse().map(e=>`<li><span class="mono muted">${e.date}</span><span>${esc(e.text)}</span></li>`).join('')}</ul></div></div>`;
}
function tExpediente(v,a){
  return `<div class="grid2"><div class="panel"><h3>Decisión del oficial de cumplimiento</h3>
   <div class="f" style="margin-bottom:10px"><label for="dAnal">Analista</label><input id="dAnal" placeholder="Nombre del analista"></div>
   <div class="f" style="margin-bottom:10px"><label for="dDec">Decisión final</label>${sel('dDec',['Aprobar','Aprobar con debida diligencia reforzada','Rechazar operación','Rechazar y preparar ROS'],a.decision==='Bloquear'?'Rechazar y preparar ROS':a.decision.startsWith('Revisar')?'Aprobar con debida diligencia reforzada':'Aprobar')}</div>
   <div class="f" style="margin-bottom:10px"><label for="dJus">Justificación</label><textarea id="dJus" placeholder="Hallazgos revisados, fuentes consultadas y razón de la decisión"></textarea><div class="hint" id="dErr"></div></div>
   <div class="row"><button class="btn acc" id="saveDec">Guardar decisión</button><button class="btn ghost" onclick="window.print()">Imprimir expediente</button></div></div>
   <div class="panel"><h3>Contenido del expediente</h3><ul>
    <li>Ficha del buque y validación OMI</li><li>Cadena de control y screening por parte</li><li>Resultado por lista con versión de cada fuente</li><li>Riesgo operativo, PSC e historial de bandera</li><li>Constancias de verificación manual</li><li>Decisión, analista, fecha y justificación</li><li>Soporte para ROS ante la UAF (si aplica)</li></ul>
    ${v.decisionLog.length?`<h3 style="margin-top:14px">Decisiones registradas</h3><ul class="timeline">${v.decisionLog.map(d=>`<li><span class="mono muted">${d.date}</span><span><b>${esc(d.dec)}</b> — ${esc(d.anal)}<br><span class="muted">${esc(d.jus)}</span></span></li>`).join('')}</ul>`:''}</div></div>`;
}

/* ---------- Eventos ---------- */
function bindOpen(){document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>go('ficha',e.dataset.open))}
function bind(){
  bindOpen();
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render()});
  const sim=document.getElementById('simUpd');if(sim)sim.onclick=simulate;
  const rs=document.getElementById('rescreen');if(rs)rs.onclick=()=>{const v=DB.find(x=>x.imo===current);v.events.push({date:today(),text:'Re-screening manual: '+assess(v).decision});render();toast('Re-screening completado')};
  const sd=document.getElementById('saveDec');if(sd)sd.onclick=()=>{
    const anal=document.getElementById('dAnal').value.trim(),jus=document.getElementById('dJus').value.trim(),err=document.getElementById('dErr');
    if(!anal||!jus){err.textContent='Indica el analista y la justificación para guardar la decisión.';err.className='hint bad';return}
    const v=DB.find(x=>x.imo===current),dec=document.getElementById('dDec').value;
    v.decisionLog.push({date:today(),dec,anal,jus});v.events.push({date:today(),text:'Decisión registrada: '+dec+' ('+anal+')'});render();toast('Decisión guardada en el expediente')};
  const imo=document.getElementById('imo');
  if(imo){
    imo.oninput=()=>{const n=imo.value.replace(/\D/g,''),h=document.getElementById('imoHint');
      if(n.length<7){h.textContent='7 dígitos; el último es de control';h.className='hint'}
      else if(n.length>7||!validShip(n)){h.textContent='OMI inválido: el dígito de control debería ser '+(n.length>=6?shipCheck(n.slice(0,6)):'?');h.className='hint bad'}
      else if(DB.some(v=>v.imo===n)){h.innerHTML='Válido · ya está en la cartera';h.className='hint ok'}
      else{h.textContent='OMI válido';h.className='hint ok'}};
    const mm=document.getElementById('mmsi');mm.oninput=()=>{const h=document.getElementById('mmsiHint'),m=mm.value.replace(/\D/g,''),f=document.getElementById('flag').value;
      if(m.length===9&&f==='Panamá'&&!/^(35[1-7]|37[0-3])/.test(m)){h.textContent='El MMSI no corresponde a Panamá: señal de alerta';h.className='hint bad'}else{h.textContent='Panamá usa prefijos 351–357, 370–373';h.className='hint'}};
    ['own','doc','opr','chr'].forEach(k=>{const e=document.getElementById(k+'i');e.oninput=()=>{const h=document.getElementById(k+'iHint'),n=e.value.replace(/\D/g,'');
      if(!n){h.textContent='';return}if(n.length<7){h.textContent='7 dígitos';h.className='hint'}else if(validComp(n)){h.textContent='Válido';h.className='hint ok'}else{h.textContent='Inválido (módulo 11)';h.className='hint bad'}}});
    document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>fill(b.dataset.fill));
    document.getElementById('run').onclick=()=>{
      const v=collect(),hint=document.getElementById('runHint');
      if(!validShip(v.imo)){hint.textContent='Ingresa un número OMI válido para continuar.';hint.style.color='var(--bad)';imo.focus();return}
      if(!v.name){hint.textContent='Ingresa el nombre actual del buque.';hint.style.color='var(--bad)';return}
      if(DB.some(x=>x.imo===v.imo)){hint.textContent='';go('ficha',v.imo);return}
      hint.textContent='';
      // señales derivadas de datos capturados
      const bad=v.parties.filter(p=>p.cimo&&!validComp(p.cimo));
      if(bad.length)v.events.push({date:today(),text:'OMI de compañía inválido: '+bad.map(p=>p.name).join(', ')});
      if(/crescent line/i.test(JSON.stringify(v.parties)))v.hits.push({src:'eu',type:'Nombre difuso',target:v.parties.find(p=>/crescent/i.test(p.name)).name,matched:'CRESCENT LINE MARINE FZCO',score:86,program:'Rusia'});
      DB.unshift(v);document.getElementById('run').disabled=true;runPipeline(v);document.getElementById('alertCount').textContent=alerts().length;
    };
  }
}
function simulate(){
  SOURCES.forEach(s=>{srcState[s.id].last='0 min';});
  ['ofac','uksl'].forEach(id=>{srcState[id].hash=Math.random().toString(16).slice(2,10);srcState[id].status='Cambios procesados'});
  const pv=DB.find(v=>v.name==='PACIFIC VENTURE');
  if(pv&&!pv.hits.length){pv.hits.push({src:'uksl',type:'Nombre difuso',target:'Kordan Freight Services',matched:'KORDAN FREIGHT SERVICES LTD',score:93,program:'Rusia'});
    pv.events.push({date:today(),text:'Actualización UKSL: nueva coincidencia con el fletador Kordan Freight Services'});}
  DB.forEach(v=>v.events.push({date:today(),text:'Re-screening automático tras actualización de OFAC y UKSL'}));
  render();toast('Listas actualizadas: OFAC y UKSL con cambios. Cartera revisada; 1 alerta nueva.');
}
render();
</script>
</body>
</html>
